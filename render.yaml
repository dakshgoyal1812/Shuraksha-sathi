services:
  # ============================================================================
  # 1. Backend Web Service (FastAPI + Uvicorn)
  # ============================================================================
  - type: web
    name: suraksha-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000

  # ============================================================================
  # 2. Frontend Static Site (Vite + React)
  # ============================================================================
  - type: static
    name: suraksha-frontend
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: suraksha-backend
          property: host
